name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'scripts/build-static.js'
      - '.github/workflows/build-desktop-macos.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release — leave empty to auto-bump the last release''s patch version'
        required: false
        type: string

# Needed by the version-bump commit/tag push in determine-release, and by
# the release-asset uploads in the two build jobs.
permissions:
  contents: write

jobs:
  # Figures out the release version once, up front, and (if this run should
  # release at all) bumps + commits the app's own version metadata and
  # creates the tag — so build-macos and build-windows can just check that
  # tag out and build from an already-correctly-versioned commit, instead
  # of each doing their own (potentially conflicting) version bookkeeping.
  determine-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      should_release: ${{ steps.release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history/tags — needed to find the latest release tag to bump

      # Figures out whether this run should end in a GitHub Release, and
      # under which tag. Three cases: a tag push (release under that tag),
      # a manual dispatch with an explicit version (release under that),
      # or a manual dispatch with no version — auto-bumps the patch number
      # of the latest vX.Y.Z release tag (falling back to whatever's
      # currently in desktop/package.json if there's no release yet). A
      # plain push to main (CI's own "does it still build" check, not a
      # manual run) never releases, only builds the macOS artifact below.
      - name: Determine release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.version }}" ]]; then
              raw="${{ inputs.version }}"
              echo "tag=v${raw#v}" >> "$GITHUB_OUTPUT"
            else
              git fetch --tags --quiet
              latest="$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
              if [[ -n "$latest" ]]; then
                base="${latest#v}"
                IFS='.' read -r major minor patch <<< "$base"
                echo "tag=v${major}.${minor}.$((patch + 1))" >> "$GITHUB_OUTPUT"
              else
                current="$(grep -m1 '"version"' desktop/package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
                echo "tag=v${current}" >> "$GITHUB_OUTPUT"
              fi
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      # Rewrites the app's own version metadata (macOS "About" panel,
      # Windows installer version, Cargo.toml, package.json) to match the
      # release tag and commits that back to main, so the checked-in
      # version never drifts behind what's actually been released and
      # nobody ever has to hand-edit three files to cut one. Skipped for a
      # tag push — that path is for tagging manually, and whoever did that
      # is responsible for the version themselves.
      - name: Sync and commit app version
        if: steps.release.outputs.should_release == 'true' && github.ref_type != 'tag'
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.tag }}"
          version="${version#v}"
          sed -i 's/"version": "[^"]*"/"version": "'"$version"'"/' desktop/src-tauri/tauri.conf.json
          sed -i 's/"version": "[^"]*"/"version": "'"$version"'"/' desktop/package.json
          sed -i 's/^version = "[^"]*"/version = "'"$version"'"/' desktop/src-tauri/Cargo.toml
          sed -i "s/^const APP_VERSION = '[^']*';/const APP_VERSION = '$version';/" public/js/version.js
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add desktop/src-tauri/tauri.conf.json desktop/package.json desktop/src-tauri/Cargo.toml public/js/version.js
            git commit -m "chore: bump desktop app version to $version [skip ci]"
            git push origin HEAD:main
          fi

      # For a tag push this is a no-op condition (the tag already exists by
      # definition) — for a manual dispatch, tags the version-bump commit
      # above (or HEAD, if nothing needed bumping) so the release points at
      # a commit whose own files already agree with the tag name.
      - name: Create and push release tag
        if: steps.release.outputs.should_release == 'true' && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      # Creates the (asset-less, for now) Release with its notes/body here,
      # once, before the macOS and Windows builds start — they run in
      # parallel and only attach their own files afterwards, never touching
      # the body, so there's no race over which platform's text wins.
      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          body: |
            **Windows**: this build isn't signed, so Windows SmartScreen may show "Windows protected your PC" when you first run the installer. Click **More info → Run anyway** — it isn't actually unsafe, just unsigned (no paid code-signing certificate).

            **macOS**: same idea if you see "PATCH.doc is damaged and can't be opened" — the `.dmg` includes a README with the one-line fix.
          append_body: true

  build-macos:
    needs: determine-release
    runs-on: macos-latest
    steps:
      # Builds from the tag determine-release just created (already at the
      # correct version) when this run releases, otherwise from whatever
      # ref triggered the workflow (a plain push-to-main sanity build).
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-release.outputs.should_release == 'true' && needs.determine-release.outputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS app
        working-directory: desktop
        run: npm run build

      # Unsigned build — since there's no paid Apple Developer account to
      # sign/notarize with, Gatekeeper often refuses to even open the app
      # from /Applications ("is damaged and can't be opened"), not just
      # show the milder "unidentified developer" warning. Tauri's own DMG
      # config has no option to drop an extra file into the disk image
      # itself (only into the .app bundle, which nobody reads before
      # hitting that error) — so this converts the just-built read-only
      # .dmg to a writable image, copies a README onto it, then converts
      # it back to the same compressed read-only format Tauri produced.
      - name: Add troubleshooting README to the .dmg
        working-directory: desktop/src-tauri/target/release/bundle/dmg
        run: |
          set -euo pipefail
          dmg="$(ls *.dmg)"
          size_mb=$(( ($(stat -f%z "$dmg") / 1024 / 1024) + 10 ))

          cat > readme.txt <<'EOF'
          PATCH.doc — if macOS says the app is damaged
          =============================================

          This build isn't signed with a paid Apple Developer certificate.
          macOS Gatekeeper blocks unsigned apps downloaded from the internet
          and may say "PATCH.doc is damaged and can't be opened, you should
          move it to the Trash" after you copy it to /Applications.

          The app isn't actually damaged. To open it, run this once in
          Terminal (Applications > Utilities > Terminal):

              xattr -cr /Applications/PATCH.doc.app

          Then open PATCH.doc normally.
          EOF
          sed -i '' 's/^[[:space:]]*//' readme.txt

          hdiutil convert "$dmg" -format UDRW -o rw.dmg
          rm -f "$dmg"
          hdiutil resize -size "${size_mb}m" rw.dmg
          mkdir -p mnt
          hdiutil attach rw.dmg -mountpoint mnt -nobrowse -noautoopen
          cp readme.txt "mnt/README - if the app won't open.txt"
          hdiutil detach mnt
          rmdir mnt
          hdiutil convert rw.dmg -format UDZO -o "$dmg"
          rm -f rw.dmg readme.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchdoc-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      # Attaches the .dmg to the Release determine-release already created
      # (with its notes/body) — no login required to download a Release,
      # unlike a plain CI artifact. Doesn't touch generate_release_notes/
      # body here, so it can't race with build-windows over the text.
      - name: Attach .dmg to GitHub Release
        if: needs.determine-release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-release.outputs.tag }}
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  # Only runs for an actual release, not on every push-to-main sanity
  # build — Windows CI minutes aren't worth spending on every commit when
  # the Rust/JS code underneath is the same as the macOS build already
  # checks. Uses the same tag as build-macos, so both platforms land as
  # assets on one combined release rather than two separate ones.
  build-windows:
    needs: determine-release
    if: needs.determine-release.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.determine-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows app
        working-directory: desktop
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchdoc-windows
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # Same unsigned-build situation as macOS, but Windows SmartScreen's
      # bypass is simpler (no terminal command needed) — mentioned in the
      # release notes instead of embedded in the installer, since unlike a
      # .dmg there's no folder to drop a loose file into.
      - name: Add SmartScreen note to the release
        run: |
          echo "### Windows SmartScreen" >> "$env:GITHUB_STEP_SUMMARY"
          echo "This build isn't signed, so Windows may show ""Windows protected your PC"". Click **More info > Run anyway** — the installer isn't actually unsafe, just unsigned." >> "$env:GITHUB_STEP_SUMMARY"

      # Same reasoning as the macOS attach step — determine-release already
      # created the Release with its notes/body, this only adds files.
      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-release.outputs.tag }}
          files: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
