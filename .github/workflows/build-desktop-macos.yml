name: Build macOS desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'scripts/build-static.js'
      - '.github/workflows/build-desktop-macos.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag and release (e.g. 1.0.1) — leave empty to just build, no release'
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    # Needed to create/push the release tag and to publish the GitHub
    # Release itself, below.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Figures out whether this run should end in a GitHub Release, and
      # under which tag — either because it was triggered by a tag push, or
      # because it was manually dispatched with a version number.
      - name: Determine release tag
        id: release
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            raw="${{ inputs.version }}"
            echo "tag=v${raw#v}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      # Only needed for the manual-dispatch-with-version case above — a
      # real tag push already has its tag pushed by definition.
      - name: Create and push release tag
        if: steps.release.outputs.should_release == 'true' && github.ref_type != 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.release.outputs.tag }}"
          git push origin "${{ steps.release.outputs.tag }}"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build macOS app
        working-directory: desktop
        run: npm run build

      # Unsigned build — since there's no paid Apple Developer account to
      # sign/notarize with, Gatekeeper often refuses to even open the app
      # from /Applications ("is damaged and can't be opened"), not just
      # show the milder "unidentified developer" warning. Tauri's own DMG
      # config has no option to drop an extra file into the disk image
      # itself (only into the .app bundle, which nobody reads before
      # hitting that error) — so this converts the just-built read-only
      # .dmg to a writable image, copies a README onto it, then converts
      # it back to the same compressed read-only format Tauri produced.
      - name: Add troubleshooting README to the .dmg
        working-directory: desktop/src-tauri/target/release/bundle/dmg
        run: |
          set -euo pipefail
          dmg="$(ls *.dmg)"
          size_mb=$(( ($(stat -f%z "$dmg") / 1024 / 1024) + 10 ))

          cat > readme.txt <<'EOF'
          PATCH.doc — if macOS says the app is damaged
          =============================================

          This build isn't signed with a paid Apple Developer certificate.
          macOS Gatekeeper blocks unsigned apps downloaded from the internet
          and may say "PATCH.doc is damaged and can't be opened, you should
          move it to the Trash" after you copy it to /Applications.

          The app isn't actually damaged. To open it, run this once in
          Terminal (Applications > Utilities > Terminal):

              xattr -cr /Applications/PATCH.doc.app

          Then open PATCH.doc normally.
          EOF
          sed -i '' 's/^[[:space:]]*//' readme.txt

          hdiutil convert "$dmg" -format UDRW -o rw.dmg
          rm -f "$dmg"
          hdiutil resize -size "${size_mb}m" rw.dmg
          mkdir -p mnt
          hdiutil attach rw.dmg -mountpoint mnt -nobrowse -noautoopen
          cp readme.txt "mnt/README - if the app won't open.txt"
          hdiutil detach mnt
          rmdir mnt
          hdiutil convert rw.dmg -format UDZO -o "$dmg"
          rm -f rw.dmg readme.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patchdoc-macos
          path: |
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

      # Publishes the .dmg as a downloadable GitHub Release, in addition to
      # the always-on build artifact above. Runs for a tag push (git tag
      # v1.0.0 && git push origin v1.0.0) or for a manual dispatch run with
      # a version number filled in (Actions → Run workflow).
      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          generate_release_notes: true
